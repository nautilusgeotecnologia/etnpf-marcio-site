<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado Arrais-Amador</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; }
  .alt-btn.selecionada { background-color: #2563eb; color: white; }
  .alt-btn.correta { background-color: #16a34a; color: white; }
  .alt-btn.incorreta { background-color: #dc2626; color: white; }
</style>
</head>
<body class="bg-slate-100 min-h-screen">

<div id="app" class="max-w-3xl mx-auto p-4">

  <!-- TELA DE CONFIGURAÇÃO -->
  <div id="telaConfig" class="bg-white rounded-xl shadow p-6">
    <h1 class="text-2xl font-bold mb-4 text-blue-700">Simulado Arrais-Amador</h1>

    <label class="block mb-2 font-semibold">Assunto</label>
    <select id="selAssunto" class="w-full border rounded p-2 mb-4">
      <option value="todos">Todos os assuntos</option>
      <option value="marinharia">Marinharia</option>
      <option value="navegacao">Navegação</option>
      <option value="ripeam">RIPEAM</option>
      <option value="legislacao">Legislação e Segurança</option>
    </select>

    <label class="block mb-2 font-semibold">Nível</label>
    <select id="selNivel" class="w-full border rounded p-2 mb-4">
      <option value="todos">Todos os níveis</option>
      <option value="facil">Fácil</option>
      <option value="medio">Médio</option>
      <option value="dificil">Difícil</option>
    </select>

    <label class="block mb-2 font-semibold">Quantidade de questões</label>
    <input id="inpQuantidade" type="number" min="5" max="50" value="20" class="w-full border rounded p-2 mb-4">

    <button id="btnIniciar" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700">
      Iniciar Simulado
    </button>
  </div>

  <!-- TELA DE QUESTÃO -->
  <div id="telaQuestao" class="bg-white rounded-xl shadow p-6 hidden">
    <div class="flex justify-between items-center mb-4">
      <span id="lblProgresso" class="font-semibold text-slate-600"></span>
      <span id="lblCronometro" class="font-mono text-lg text-blue-700">00:00</span>
    </div>

    <div class="mb-2">
      <span id="lblAssuntoQuestao" class="text-xs uppercase tracking-wide text-slate-500"></span>
    </div>

    <p id="txtEnunciado" class="text-lg mb-4"></p>

    <div id="contAlternativas" class="space-y-2 mb-6"></div>

    <div class="flex justify-between">
      <button id="btnAnterior" class="bg-slate-300 px-4 py-2 rounded font-semibold">Anterior</button>
      <button id="btnProxima" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold">Próxima</button>
    </div>
  </div>

  <!-- TELA DE RESULTADO -->
  <div id="telaResultado" class="bg-white rounded-xl shadow p-6 hidden">
    <h2 class="text-2xl font-bold mb-4 text-blue-700">Resultado do Simulado</h2>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-slate-50 rounded p-4 text-center">
        <p class="text-sm text-slate-500">Acertos</p>
        <p id="lblAcertos" class="text-2xl font-bold text-green-600"></p>
      </div>
      <div class="bg-slate-50 rounded p-4 text-center">
        <p class="text-sm text-slate-500">Aproveitamento</p>
        <p id="lblPercentual" class="text-2xl font-bold text-blue-600"></p>
      </div>
    </div>

    <div class="mb-6">
      <p class="font-semibold mb-1">Classificação</p>
      <p id="lblClassificacao" class="text-lg font-bold"></p>
    </div>

    <div id="contDiagnostico" class="mb-6 space-y-2"></div>

    <div id="contRevisao" class="space-y-4 mb-6"></div>

    <div class="flex gap-3">
      <button id="btnRefazer" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold">Novo Simulado</button>
      <button id="btnCopiarResultado" class="bg-slate-600 text-white px-4 py-2 rounded font-semibold">Copiar resultado pro chat</button>
    </div>
  </div>

</div>

<script>
// ===================== ESTADO GLOBAL =====================
let bancoQuestoes = [];      // preenchido pelas Partes 3, 4, 5 e 6
let questoesSimulado = [];
let indiceAtual = 0;
let respostasUsuario = [];   // { questaoId, alternativaEscolhida, correta }
let cronometroInterval = null;
let segundosDecorridos = 0;

// ===================== ELEMENTOS =====================
const telaConfig = document.getElementById('telaConfig');
const telaQuestao = document.getElementById('telaQuestao');
const telaResultado = document.getElementById('telaResultado');

const selAssunto = document.getElementById('selAssunto');
const selNivel = document.getElementById('selNivel');
const inpQuantidade = document.getElementById('inpQuantidade');
const btnIniciar = document.getElementById('btnIniciar');

const lblProgresso = document.getElementById('lblProgresso');
const lblCronometro = document.getElementById('lblCronometro');
const lblAssuntoQuestao = document.getElementById('lblAssuntoQuestao');
const txtEnunciado = document.getElementById('txtEnunciado');
const contAlternativas = document.getElementById('contAlternativas');
const btnAnterior = document.getElementById('btnAnterior');
const btnProxima = document.getElementById('btnProxima');

const lblAcertos = document.getElementById('lblAcertos');
const lblPercentual = document.getElementById('lblPercentual');
const lblClassificacao = document.getElementById('lblClassificacao');
const contDiagnostico = document.getElementById('contDiagnostico');
const contRevisao = document.getElementById('contRevisao');
const btnRefazer = document.getElementById('btnRefazer');
const btnCopiarResultado = document.getElementById('btnCopiarResultado');

// ===================== UTILITÁRIOS =====================
function embaralhar(array) {
  const copia = [...array];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function formatarTempo(segundos) {
  const m = Math.floor(segundos / 60).toString().padStart(2, '0');
  const s = (segundos % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function iniciarCronometro() {
  segundosDecorridos = 0;
  lblCronometro.textContent = '00:00';
  cronometroInterval = setInterval(() => {
    segundosDecorridos++;
    lblCronometro.textContent = formatarTempo(segundosDecorridos);
  }, 1000);
}

function pararCronometro() {
  clearInterval(cronometroInterval);
}

// ===================== INÍCIO DO SIMULADO =====================
btnIniciar.addEventListener('click', () => {
  const assunto = selAssunto.value;
  const nivel = selNivel.value;
  const quantidade = parseInt(inpQuantidade.value, 10);

  let filtradas = bancoQuestoes.filter(q => {
    const okAssunto = assunto === 'todos' || q.assunto === assunto;
    const okNivel = nivel === 'todos' || q.nivel === nivel;
    return okAssunto && okNivel;
  });

  if (filtradas.length === 0) {
    alert('Não há questões cadastradas para esse filtro. Verifique se as Partes 3 a 6 foram coladas corretamente.');
    return;
  }

  filtradas = embaralhar(filtradas);
  questoesSimulado = filtradas.slice(0, Math.min(quantidade, filtradas.length));

  respostasUsuario = questoesSimulado.map(q => ({
    questaoId: q.id,
    alternativaEscolhida: null,
    correta: false
  }));

  indiceAtual = 0;

  telaConfig.classList.add('hidden');
  telaResultado.classList.add('hidden');
  telaQuestao.classList.remove('hidden');

  iniciarCronometro();
  renderQuestao();
});

// ===================== RENDERIZAÇÃO DA QUESTÃO =====================
function renderQuestao() {
  const questao = questoesSimulado[indiceAtual];

  lblProgresso.textContent = `Questão ${indiceAtual + 1} de ${questoesSimulado.length}`;
  lblAssuntoQuestao.textContent = mapAssunto(questao.assunto) + ' • ' + mapNivel(questao.nivel);
  txtEnunciado.textContent = questao.enunciado;

  contAlternativas.innerHTML = '';

  const respostaAtual = respostasUsuario[indiceAtual].alternativaEscolhida;

  questao.alternativas.forEach((altTexto, idx) => {
    const letra = String.fromCharCode(65 + idx); // A, B, C, D, E

    const div = document.createElement('button');
    div.type = 'button';
    div.className = 'alt-btn w-full text-left border rounded p-3 hover:bg-slate-50';
    div.textContent = `${letra}) ${altTexto}`;
    div.dataset.letra = letra;

    if (respostaAtual === letra) {
      div.classList.add('selecionada');
    }

    div.addEventListener('click', () => selecionarAlternativa(letra));

    contAlternativas.appendChild(div);
  });

  btnAnterior.disabled = indiceAtual === 0;
  btnAnterior.classList.toggle('opacity-50', indiceAtual === 0);

  btnProxima.textContent = indiceAtual === questoesSimulado.length - 1 ? 'Finalizar' : 'Próxima';
}

function mapAssunto(a) {
  const mapa = {
    marinharia: 'Marinharia',
    navegacao: 'Navegação',
    ripeam: 'RIPEAM',
    legislacao: 'Legislação e Segurança'
  };
  return mapa[a] || a;
}

function mapNivel(n) {
  const mapa = { facil: 'Fácil', medio: 'Médio', dificil: 'Difícil' };
  return mapa[n] || n;
}

// ===================== SELEÇÃO DE ALTERNATIVA =====================
function selecionarAlternativa(letra) {
  respostasUsuario[indiceAtual].alternativaEscolhida = letra;

  const botoes = contAlternativas.querySelectorAll('.alt-btn');
  botoes.forEach(b => {
    b.classList.toggle('selecionada', b.dataset.letra === letra);
  });
}

// ===================== NAVEGAÇÃO =====================
btnAnterior.addEventListener('click', () => {
  if (indiceAtual > 0) {
    indiceAtual--;
    renderQuestao();
  }
});

btnProxima.addEventListener('click', () => {
  if (indiceAtual < questoesSimulado.length - 1) {
    indiceAtual++;
    renderQuestao();
  } else {
    finalizarSimulado();
  }
});

// ===================== FINALIZAÇÃO E CORREÇÃO =====================
function finalizarSimulado() {
  pararCronometro();

  respostasUsuario.forEach((resp, idx) => {
    const questao = questoesSimulado[idx];
    resp.correta = resp.alternativaEscolhida === questao.gabarito;
  });

  processarResultado();

  telaQuestao.classList.add('hidden');
  telaResultado.classList.remove('hidden');
}

function processarResultado() {
  const totalQuestoes = questoesSimulado.length;
  const acertos = respostasUsuario.filter(r => r.correta).length;
  const percentual = Math.round((acertos / totalQuestoes) * 100);

  lblAcertos.textContent = `${acertos} / ${totalQuestoes}`;
  lblPercentual.textContent = `${percentual}%`;

  let classificacao = '';
  let corClasse = '';
  if (percentual <= 40) {
    classificacao = 'Crítico';
    corClasse = 'text-red-600';
  } else if (percentual <= 60) {
    classificacao = 'Intermediário';
    corClasse = 'text-orange-500';
  } else if (percentual <= 80) {
    classificacao = 'Competitivo';
    corClasse = 'text-blue-600';
  } else {
    classificacao = 'Nível Aprovação';
    corClasse = 'text-green-600';
  }
  lblClassificacao.textContent = classificacao;
  lblClassificacao.className = 'text-lg font-bold ' + corClasse;

  // ---- Diagnóstico por assunto ----
  const porAssunto = {};
  questoesSimulado.forEach((q, idx) => {
    if (!porAssunto[q.assunto]) {
      porAssunto[q.assunto] = { total: 0, acertos: 0 };
    }
    porAssunto[q.assunto].total++;
    if (respostasUsuario[idx].correta) {
      porAssunto[q.assunto].acertos++;
    }
  });

  contDiagnostico.innerHTML = '<p class="font-semibold mb-2">Diagnóstico por assunto</p>';
  Object.keys(porAssunto).forEach(assunto => {
    const dados = porAssunto[assunto];
    const pct = Math.round((dados.acertos / dados.total) * 100);
    const linha = document.createElement('div');
    linha.className = 'flex justify-between items-center bg-slate-50 rounded p-2';
    linha.innerHTML = `
      <span>${mapAssunto(assunto)}</span>
      <span class="font-semibold ${pct < 60 ? 'text-red-600' : 'text-green-600'}">
        ${dados.acertos}/${dados.total} (${pct}%)
      </span>`;
    contDiagnostico.appendChild(linha);
  });

  // ---- Sugestão de estudo baseada no pior assunto ----
  let piorAssunto = null;
  let piorPct = 101;
  Object.keys(porAssunto).forEach(assunto => {
    const dados = porAssunto[assunto];
    const pct = (dados.acertos / dados.total) * 100;
    if (pct < piorPct) {
      piorPct = pct;
      piorAssunto = assunto;
    }
  });

  if (piorAssunto && piorPct < 100) {
    const sugestao = document.createElement('p');
    sugestao.className = 'text-sm text-slate-600 mt-2';
    sugestao.textContent = `Sugestão: reforce os estudos em ${mapAssunto(piorAssunto)}, assunto com menor aproveitamento neste simulado.`;
    contDiagnostico.appendChild(sugestao);
  }

  // ---- Revisão questão a questão ----
  contRevisao.innerHTML = '<p class="font-semibold mb-2">Revisão das questões</p>';
  questoesSimulado.forEach((q, idx) => {
    const resp = respostasUsuario[idx];
    const bloco = document.createElement('div');
    bloco.className = 'border rounded p-3';
    bloco.innerHTML = `
      <p class="font-semibold mb-1">${idx + 1}. ${q.enunciado}</p>
      <p class="text-sm ${resp.correta ? 'text-green-600' : 'text-red-600'}">
        Sua resposta: ${resp.alternativaEscolhida || '(em branco)'} —
        Gabarito: ${q.gabarito} —
        ${resp.correta ? 'Correta' : 'Incorreta'}
      </p>`;
    contRevisao.appendChild(bloco);
  });
}

// ===================== NOVO SIMULADO / COPIAR RESULTADO =====================
btnRefazer.addEventListener('click', () => {
  telaResultado.classList.add('hidden');
  telaConfig.classList.remove('hidden');
});

btnCopiarResultado.addEventListener('click', () => {
  const acertos = respostasUsuario.filter(r => r.correta).length;
  const total = questoesSimulado.length;
  const pct = Math.round((acertos / total) * 100);
  const texto = `Resultado do simulado: ${acertos}/${total} (${pct}%) - ${lblClassificacao.textContent}`;
  navigator.clipboard.writeText(texto).then(() => {
    alert('Resultado copiado! Cole no chat.');
  });
});
